<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Clash Royale Wiki</title>
  <style>
    body {
      background-color: #0e0e0e;
      color: #fff;
      margin: 0;
      font-family: Arial, sans-serif;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: #1c1c1c;
      padding: 20px 40px;
      border-bottom: 3px solid #f39c12;
    }

    header h1 {
      font-size: 48px;
      color: #f9c72a;
      margin: 0;
      text-shadow: 2px 2px 0 #000, 4px 4px 8px #f39c12;
    }

    .corner {
      font-size: 20px;
      color: #ccc;
      opacity: 0.7;
    }

    main {
      padding: 40px;
      text-align: center;
    }

    .category {
      background-color: #1e1e1e;
      margin: 20px auto;
      padding: 30px;
      border-radius: 12px;
      max-width: 500px;
      border: 2px solid #f39c12;
      transition: 0.3s;
    }

    .category:hover {
      background-color: #292929;
      transform: scale(1.02);
    }

    .category a {
      text-decoration: none;
      color: #f39c12;
      font-size: 28px;
    }
  </style>
</head>
<body>

  <header>
    <h1>CLASH ROYALE</h1>
    <div class="corner">wiki.gs</div>
  </header>

  <main>
    <div class="category">
      <a href="kolody.html">Колоды</a>
    </div>
    <div class="category">
      <a href="evolution.html">Эволюции</a>
    </div>
    <div class="category">
      <a href="updates.html">Инфа по обновлениям</a>
    </div>
  </main>

</body>
</html>
